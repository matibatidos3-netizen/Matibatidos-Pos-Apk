name: Build Matibatidos POS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto Android
        run: |
          mkdir -p build-project
          unzip -q Matibatidos_POS_APK_RC1_Project-1.zip -d build-project
          echo "Contenido preparado:"
          find build-project -maxdepth 3 -type f | sort

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: build-project/MatibatidosAPK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-APK-RC1
          path: build-project/MatibatidosAPK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
